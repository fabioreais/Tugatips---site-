<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TugaTips – Prognósticos de Futebol</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #F5C518;
    --gold-light: #FFD84D;
    --gold-dark: #C9940A;
    --green: #00C853;
    --green-dark: #00843A;
    --green-glow: rgba(0,200,83,0.18);
    --bg: #0A0D0B;
    --bg2: #111712;
    --bg3: #162019;
    --card: #131A14;
    --card-hover: #1A2A1C;
    --border: rgba(0,200,83,0.12);
    --border-gold: rgba(245,197,24,0.25);
    --text: #E8F0E9;
    --text-muted: #7A9A7E;
    --text-dim: #4A6A4E;
    --red: #FF4444;
    --orange: #FF8C00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BACKGROUND TEXTURE */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 10% 20%, rgba(0,200,83,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 90% 80%, rgba(245,197,24,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,13,11,0.95);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: radial-gradient(circle at 35% 35%, #FFD84D, #C9940A);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(245,197,24,0.4);
    flex-shrink: 0;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .logo-tuga {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .logo-tips {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--green);
    text-transform: uppercase;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  nav a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 8px 16px;
    border-radius: 6px;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  nav a:hover { color: var(--text); background: var(--bg3); }
  nav a.active { color: var(--green); background: var(--green-glow); }

  .header-cta {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-premium {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: #0A0D0B;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 9px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 16px rgba(245,197,24,0.3);
  }

  .btn-premium:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(245,197,24,0.5); }

  /* HERO STRIP */
  .hero-strip {
    background: linear-gradient(90deg, var(--bg2) 0%, var(--bg3) 50%, var(--bg2) 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 2rem;
    position: relative;
    overflow: hidden;
  }

  .hero-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
  }

  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    color: var(--text);
    letter-spacing: 2px;
    line-height: 1;
  }

  .hero-title span { color: var(--green); }

  .hero-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 4px;
  }

  .hero-stats {
    display: flex;
    gap: 2rem;
  }

  .stat-box {
    text-align: center;
  }

  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* MAIN LAYOUT */
  .main-wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 2rem;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 2rem;
    position: relative;
    z-index: 1;
  }

  /* FILTERS */
  .filters-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-right: 4px;
  }

  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .filter-btn:hover { border-color: var(--green); color: var(--text); }
  .filter-btn.active { border-color: var(--green); color: var(--green); background: var(--green-glow); }

  .filter-badge {
    background: var(--green);
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    min-width: 20px;
    text-align: center;
  }

  /* CARD (RESUMO) */
  .pred-card { margin-bottom: 20px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-wrap">
      <div class="logo-icon">⚽</div>
      <div class="logo-text">
        <div class="logo-tuga">TUGA</div>
        <div class="logo-tips">TIPS</div>
      </div>
    </div>
  </div>
</header>

<h1 style="padding:20px">TugaTips Site a funcionar 🚀</h1>

</body>
</html>
